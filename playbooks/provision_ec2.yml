---
- name: Provision EC2 for Flask
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../keys.yml

  vars:
    vpc_cidr: "10.10.0.0/16"
    subnet_cidr: "10.10.1.0/24"
    name_tag_prefix: "pradeep-flask-cicd"
    ami_id: "ami-026ebd4cfe2c043b2"   # adjust for your region if needed
    instance_type: t2.micro

  tasks:
    - name: Create keypair
      amazon.aws.ec2_key:
        name: "{{ KEY_NAME }}"
        region: "{{ AWS_REGION }}"
        state: present
      register: keypair

    - name: Save private key locally if returned
      copy:
        dest: "./{{ KEY_NAME }}.pem"
        content: "{{ keypair.key.private_key }}"
        mode: '0600'
      when: keypair.key is defined and (keypair.key.private_key is defined)

    - name: Create VPC
      amazon.aws.ec2_vpc_net:
        region: "{{ AWS_REGION }}"
        cidr_block: "{{ vpc_cidr }}"
        name: "{{ name_tag_prefix }}-vpc"
        state: present
      register: vpc

    - name: Create subnet
      amazon.aws.ec2_vpc_subnet:
        region: "{{ AWS_REGION }}"
        vpc_id: "{{ vpc.vpc.id }}"
        cidr: "{{ subnet_cidr }}"
        map_public: yes
        state: present
      register: subnet

    - name: Create Internet Gateway
      amazon.aws.ec2_vpc_igw:
        region: "{{ AWS_REGION }}"
        vpc_id: "{{ vpc.vpc.id }}"
        state: present
      register: igw

    - name: Create route table and associate subnet
      amazon.aws.ec2_vpc_route_table:
        region: "{{ AWS_REGION }}"
        vpc_id: "{{ vpc.vpc.id }}"
        routes:
          - dest: 0.0.0.0/0
            gateway_id: "{{ igw.gateway_id }}"
        subnets:
          - "{{ subnet.subnet.id }}"
        state: present
      register: rt

    - name: Create security group
      amazon.aws.ec2_group:
        region: "{{ AWS_REGION }}"
        vpc_id: "{{ vpc.vpc.id }}"
        name: "{{ name_tag_prefix }}-sg"
        description: "Allow SSH & HTTP"
        rules:
          - proto: tcp
            from_port: 22
            to_port: 22
            cidr_ip: 0.0.0.0/0
          - proto: tcp
            from_port: 80
            to_port: 80
            cidr_ip: 0.0.0.0/0
        state: present
      register: sg

    - name: Launch EC2 instance
      amazon.aws.ec2_instance:
        region: "{{ AWS_REGION }}"
        key_name: "{{ KEY_NAME }}"
        image_id: "{{ ami_id }}"
        instance_type: "{{ instance_type }}"
        wait: yes
        count: 1
        vpc_subnet_id: "{{ subnet.subnet.id }}"
        security_groups:
          - "{{ name_tag_prefix }}-sg"
        network:
          assign_public_ip: true
        tags:
          Name: "{{ name_tag_prefix }}-instance"
      register: ec2

    - name: Add new instance to inventory group flaskservers
      add_host:
        name: "{{ ec2.instances[0].public_ip_address }}"
        groups: flaskservers
        ansible_user: ubuntu
        ansible_ssh_private_key_file: "./{{ KEY_NAME }}.pem"

    - name: Persist EC2 public IP into inventory.ini
      lineinfile:
        path: ../inventory.ini
        insertafter: '[flaskservers]'
        line: "{{ ec2.instances[0].public_ip_address }} ansible_user=ec2-user ansible_ssh_private_key_file=./{{ KEY_NAME }}.pem"

    - name: Wait for SSH up
      wait_for:
        host: "{{ ec2.instances[0].public_ip_address }}"
        port: 22
        timeout: 300
        state: started

    - name: Show instance info
      debug:
        msg:
          - "public_ip: {{ ec2.instances[0].public_ip_address }}"
